name: Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ============================================================================
  # Backend Build & Verification Job
  # ============================================================================
  backend:
    name: Backend (Spring Boot 3 + Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Verify Spotless Java Formatting
        working-directory: ./server
        run: ./mvnw spotless:check

      - name: Compile and Test Backend
        working-directory: ./server
        run: ./mvnw test-compile

  # ============================================================================
  # Frontend Build & Verification Job
  # ============================================================================
  frontend:
    name: Frontend (React 18 + Vite 6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        working-directory: ./client
        run: npm ci

      - name: Verify Prettier Code Formatting
        working-directory: ./client
        run: npm run format:check

      - name: Build Frontend Application
        working-directory: ./client
        run: npm run build
